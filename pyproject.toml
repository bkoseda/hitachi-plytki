[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ceramic-ping-lab"
version = "0.1.0"
description = "Local first-day acoustic inspection workbench for ceramic impact tests"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.13,<2", "pandas>=2.2,<3",
  "librosa==0.11.0", "soundfile>=0.13,<0.14", "scikit-learn>=1.6,<1.8",
  "matplotlib>=3.9,<4", "plotly>=6,<7", "ipywidgets>=8.1,<9",
  "jupyterlab>=4.3,<5", "nbformat>=5.10,<6", "nbclient>=0.10,<1",
  "sounddevice>=0.5,<0.6", "imageio-ffmpeg>=0.6,<0.7", "pytest>=8,<9", "ruff>=0.12,<1"
]

[project.optional-dependencies]
embeddings = ["torch>=2.6,<2.9", "torchaudio>=2.6,<2.9", "transformers==4.57.6", "safetensors>=0.4"]

[project.scripts]
pinglab = "pinglab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real model or codec integration"]

[tool.ruff]
line-length = 110


[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
